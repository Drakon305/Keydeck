# Builds KeyDeck.exe on a real Windows machine every time the code changes.
# When VERSION in keydeck.py is a new number, it also publishes it as a BETA
# (GitHub pre-release): only copies with "Tester" ticked in Settings get it.
# Run the "Release beta to everyone" workflow to send it to everybody.

name: Build KeyDeck

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-keydeck
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: python -m pip install --upgrade keyboard pystray pillow pyperclip pyinstaller

      - name: Add the submit-only key
        # Comes from the repository secret KEYDECK_SUBMIT_TOKEN, so it is never in the code.
        # That key can only create Library submissions (issues); it can't change anything.
        shell: python
        env:
          SUBMIT_TOKEN: ${{ secrets.KEYDECK_SUBMIT_TOKEN }}
        run: |
          import os, base64
          t = os.environ.get("SUBMIT_TOKEN", "").strip()
          with open("keydeck_secrets.py", "w") as f:
              f.write("SUBMIT_KEY = %r\n" % base64.b64encode(t.encode()[::-1]).decode())
          print("Submit key included:", bool(t))

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path keydeck.py -Pattern '^VERSION = "([0-9.]+)"'
          if (-not $m) { Write-Error "VERSION line not found in keydeck.py"; exit 1 }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "KeyDeck version $v"

      - name: Test the source
        shell: pwsh
        run: |
          python -m py_compile keydeck.py
          python keydeck.py --selftest
          $code = $LASTEXITCODE
          Get-Content "$env:APPDATA\KeyDeck\startup.log" -ErrorAction SilentlyContinue
          if ($code -ne 0) { exit 1 }

      - name: Test that clicking KeyDeck keeps focus on the game
        shell: pwsh
        timeout-minutes: 4
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "kdfocus"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $p = Start-Process -FilePath python -ArgumentList "keydeck.py --focustest" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          Stop-Process -Name notepad -ErrorAction SilentlyContinue
          $line = Select-String -Path "$env:APPDATA\KeyDeck\startup.log" -Pattern "FOCUSTEST" | Select-Object -Last 1
          Write-Host "::notice title=Focus test::$($line.Line)"
          Select-String -Path "$env:APPDATA\KeyDeck\startup.log" -Pattern "FOCUSTEST|Hotkey|Post failed|Copied" | ForEach-Object { Write-Host "::notice title=Focus log::$($_.Line)" }
          if ($p.ExitCode -eq 1) { Get-Content "$env:APPDATA\KeyDeck\startup.log"; exit 1 }

      - name: Build KeyDeck.exe
        run: >
          python -m PyInstaller --onefile --noconsole --noconfirm --clean
          --name KeyDeck
          --hidden-import pystray._win32 --hidden-import PIL.ImageTk --hidden-import keydeck_secrets
          keydeck.py

      - name: Test the built .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\KeyDeck.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\KeyDeck\startup.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "Built exe failed its self-test"; exit 1 }
          Write-Host "Built exe passed its self-test"

      - name: Keep a copy of this build
        uses: actions/upload-artifact@v4
        with:
          name: KeyDeck-${{ steps.ver.outputs.version }}
          path: dist/KeyDeck.exe

      - name: Publish release (only when VERSION is new)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists - nothing to publish."
            exit 0
          }
          $notes = if ($env:NOTES) { $env:NOTES } else { "KeyDeck $tag" }
          # New versions go to testers first (pre-release). Run the
          # "Release beta to everyone" workflow to send it to everybody.
          gh release create $tag "dist/KeyDeck.exe" --title "KeyDeck $tag" --notes "$notes" --prerelease
          Write-Host "Published $tag as a BETA (testers only)"
          "### KeyDeck $tag is out for testers`nWhen it looks good, run **Release beta to everyone** in the Actions tab." >> $env:GITHUB_STEP_SUMMARY
